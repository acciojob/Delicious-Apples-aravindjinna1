<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest Hero Section</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 500px;
      padding: 40px;
      box-sizing: border-box;
      gap: 40px;
    }

    .hero-content {
      flex: 1;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .hero img {
      width: 500px;
      height: 400px;
      object-fit: cover;
      border-radius: 20px;
    }

    .explore-btn {
      display: inline-block;
      padding: 14px 25px;
      background-color: #e60023;
      color: white;
      border-radius: 25px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="hero">

    <div class="hero-content">
      <h1>Discover Your Next Idea</h1>

      <p>
        Explore inspiring ideas, discover beautiful places,
        and find something new to create every day.
      </p>

      <a href="#" class="explore-btn">Explore now</a>
    </div>

    <img
      src="https://images.pexels.com/photos/2662116/pexels-photo-2662116.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
      alt="Inspiring Pinterest-style landscape"
    >

  </div>

</body>
</html>
